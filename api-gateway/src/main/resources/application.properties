spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[0].filters[0]=AddRequestHeader=X-Gateway,API-Gateway

#spring.cloud.gateway.server.webmvc.routes[0].filters[1]=AddResponseHeader=X-Gateway-Response,Processed

spring.cloud.gateway.server.webmvc.routes[0].filters[1]=RemoveRequestHeader=X-Test-Header
spring.cloud.gateway.server.webmvc.routes[0].filters[2]=SetRequestHeader=X-Test-Header,Changed-By-Gateway
spring.cloud.gateway.server.webmvc.routes[0].filters[3]=RemoveResponseHeader=X-Gateway-Response
spring.cloud.gateway.server.webmvc.routes[0].filters[4]=SetResponseHeader=X-Gateway-Response,Modified

#spring.cloud.gateway.server.webmvc.routes[0].filters[5]=RewritePath=/api/users/(?<segment>.*),/users/${segment}
#spring.cloud.gateway.server.webmvc.routes[0].filters[5]=StripPrefix=1
#spring.cloud.gateway.server.webmvc.routes[0].filters[5]=PrefixPath=/users

#spring.cloud.gateway.server.webmvc.routes[0].filters[5]=RedirectTo=302,http://localhost:8080/users/2

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=redirect-test
spring.cloud.gateway.server.webmvc.routes[3].uri=no://op
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/redirect-test
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RedirectTo=302,http://localhost:8080/users/2